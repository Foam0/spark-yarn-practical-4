name: yarn-lab

x-common: &common
  image: apache/hadoop:3.4.1
  restart: unless-stopped
  environment: &environment
    HADOOP_HEAPSIZE_MAX: 256m
    HADOOP_HOME: /opt/hadoop
    HADOOP_MAPRED_HOME: /opt/hadoop
    HADOOP_COMMON_HOME: /opt/hadoop
    HADOOP_HDFS_HOME: /opt/hadoop
    HADOOP_YARN_HOME: /opt/hadoop
    HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
  networks:
    - hdfs
  volumes:
    - ${HDFS_CONFIG_DIR:-/opt/hdfs-cluster-practical-1/config}/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
    - ${HDFS_CONFIG_DIR:-/opt/hdfs-cluster-practical-1/config}/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    - ./config/yarn-site.xml:/opt/hadoop/etc/hadoop/yarn-site.xml:ro
    - ./config/mapred-site.xml:/opt/hadoop/etc/hadoop/mapred-site.xml:ro

services:
  resourcemanager:
    <<: *common
    hostname: resourcemanager
    command: [yarn, resourcemanager]
    ports:
      - '8088:8088'
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://localhost:8088/ws/v1/cluster/info >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  nodemanager1:
    <<: *common
    hostname: nodemanager1
    command: [yarn, nodemanager]
    environment:
      <<: *environment
      HADOOP_HEAPSIZE_MAX: 128m
    depends_on:
      resourcemanager:
        condition: service_healthy
    ports:
      - '8042:8042'
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://localhost:8042/ws/v1/node/info >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 30

  nodemanager2:
    <<: *common
    hostname: nodemanager2
    command: [yarn, nodemanager]
    environment:
      <<: *environment
      HADOOP_HEAPSIZE_MAX: 128m
    depends_on:
      resourcemanager:
        condition: service_healthy
    ports:
      - '8043:8042'
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://localhost:8042/ws/v1/node/info >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 30

  historyserver:
    <<: *common
    hostname: historyserver
    command: [mapred, historyserver]
    ports:
      - '19888:19888'
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://localhost:19888/ws/v1/history/info >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 30

networks:
  hdfs:
    external: true
    name: ${HDFS_NETWORK:-hdfs-lab_hdfs}
