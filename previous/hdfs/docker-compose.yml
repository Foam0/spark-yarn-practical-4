name: hdfs-lab

x-hadoop-common: &hadoop-common
  image: apache/hadoop:3.4.1
  restart: unless-stopped
  networks:
    - hdfs
  volumes:
    - ./config/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
    - ./config/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro

services:
  namenode:
    <<: *hadoop-common
    hostname: namenode
    command:
      - bash
      - -c
      - |
        if [ ! -d /data/name/current ]; then
          hdfs namenode -format -force -clusterId hdfs-lab
        fi
        exec hdfs namenode
    ports:
      - "9870:9870"
    volumes:
      - ./config/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./config/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - namenode-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9870/ >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  secondarynamenode:
    <<: *hadoop-common
    hostname: secondarynamenode
    command: ["hdfs", "secondarynamenode"]
    depends_on:
      namenode:
        condition: service_healthy
    ports:
      - "9868:9868"
    volumes:
      - ./config/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./config/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - secondarynamenode-data:/data

  datanode1:
    <<: *hadoop-common
    hostname: datanode1
    command: ["hdfs", "datanode"]
    depends_on:
      namenode:
        condition: service_healthy
    ports:
      - "9864:9864"
    volumes:
      - ./config/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./config/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - datanode1-data:/data

  datanode2:
    <<: *hadoop-common
    hostname: datanode2
    command: ["hdfs", "datanode"]
    depends_on:
      namenode:
        condition: service_healthy
    ports:
      - "9865:9864"
    volumes:
      - ./config/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./config/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - datanode2-data:/data

  datanode3:
    <<: *hadoop-common
    hostname: datanode3
    command: ["hdfs", "datanode"]
    depends_on:
      namenode:
        condition: service_healthy
    ports:
      - "9866:9864"
    volumes:
      - ./config/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./config/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - datanode3-data:/data

networks:
  hdfs:
    driver: bridge

volumes:
  namenode-data:
  secondarynamenode-data:
  datanode1-data:
  datanode2-data:
  datanode3-data:
